name: "🐛 버그 수정 (Fix)"
description: 서비스에 문제가 발생했을 때 제보하고 수정합니다.
title: "[Fix]: "
labels: ["bug"]
body:
  - type: textarea
    id: bug_description
    attributes:
      label: 🚨 버그 설명
      description: 어떤 문제가 발생했는지 상세히 적어주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 🔄 재현 방법
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 🖥️ 발생 환경 (브라우저)
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - 모바일 웹